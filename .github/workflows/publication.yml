# Publication d'une version : pousser une étiquette « v1.2.3 » (identique à la version de package.json), une à la fois.
# → image Docker multi-architecture sur ghcr.io, release GitHub.
name: Publication

on:
  push:
    tags: ["v*"]
  # Relance à la main (onglet Actions → Publication → Run workflow, en choisissant le tag) : utile si GitHub n'a pas
  # déclenché la publication, par exemple quand plus de trois tags sont poussés d'un coup.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: L'étiquette correspond à package.json
        run: |
          attendu="v$(jq -r .version package.json)"
          if [ "$attendu" != "${GITHUB_REF_NAME}" ]; then
            echo "Étiquette ${GITHUB_REF_NAME}, mais package.json indique ${attendu}." >&2
            exit 1
          fi

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          name: Cura Parentum ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Installer ou mettre à jour

            Sur le serveur, dans le dossier de Cura Parentum : `docker compose pull && docker compose up -d` — image
            `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`.
