# Cura Parentum sur un serveur. Démarrage : docker compose up -d   — puis ouvrir http://<serveur>:3000
# Réglages facultatifs dans un fichier .env à côté de ce fichier (voir .env.exemple).
services:
  cura-parentum:
    image: ghcr.io/nayosis/cura-parentum:${CURA_VERSION:-latest}
    # Pour construire l'image soi-même à partir des sources : décommenter la ligne suivante.
    # build: .
    container_name: cura-parentum
    restart: unless-stopped
    environment:
      # Facultatif : sans ces deux variables, le compte administrateur se crée à l'écran au premier lancement.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_MOT_DE_PASSE: ${SUPER_ADMIN_MOT_DE_PASSE:-}
      # Facultatif : « non » pour ne pas vérifier sur GitHub qu'une nouvelle version existe.
      CURA_VERIFIER_MISES_A_JOUR: ${CURA_VERIFIER_MISES_A_JOUR:-}
      # Sauvegardes automatiques gardées dans data/sauvegardes (une par nuit).
      CURA_SAUVEGARDES_CONSERVEES: ${CURA_SAUVEGARDES_CONSERVEES:-14}
      # Fuseau horaire : dates du jour et heure de la sauvegarde de la nuit.
      TZ: ${TZ:-Europe/Paris}
    volumes:
      # Base, comptes et justificatifs (photos, PDF) : à sauvegarder avec le reste du serveur.
      - ./data:/data
    ports:
      # Le reverse proxy (HTTPS) joint Cura Parentum sur ce port. S'il tourne sur cette même machine,
      # on peut restreindre à "127.0.0.1:${CURA_PORT:-3000}:3000".
      - "${CURA_PORT:-3000}:3000"
